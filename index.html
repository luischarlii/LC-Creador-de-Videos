<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creador de video publicitario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Sancreek&family=Smokum&family=Ewert&family=Holtwood+One+SC&family=Special+Elite&family=Alfa+Slab+One&display=swap">
<style>
:root{--bg:#f6f4ef;--fg:#1c1b19;--card:#fff;--mut:#6b675f;--ac:#e8590c;--bd:#e2ded4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171613;--fg:#f1efe9;--card:#23211d;--mut:#a09b90;--bd:#38352f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171613;--fg:#f1efe9;--card:#23211d;--mut:#a09b90;--bd:#38352f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:10px}.row>div{flex:1}
input[type=color]{width:100%;height:42px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);padding:2px}
button{width:100%;padding:13px;border:0;border-radius:12px;font:600 16px inherit;background:var(--ac);color:#fff;margin-top:10px}
button.sec{background:var(--bg);color:var(--fg);border:1px solid var(--bd)}
button:disabled{opacity:.5}
canvas,video{display:block;width:100%;max-width:300px;margin:0 auto;border-radius:12px;background:#000;aspect-ratio:9/16}
#msg{text-align:center;color:var(--mut);font-size:14px;min-height:20px;margin-top:8px}
#ed{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
.edbar{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut)}
.edbar button{margin:0;padding:10px 4px;font-size:14px}
.edbar input[type=range]{flex:1;min-width:0}
.edwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#bbb 0 25%,#eee 0 50%) 0 0/20px 20px;border-radius:10px;overflow:hidden}
#ec{width:auto;height:auto;max-width:100%;max-height:100%;aspect-ratio:auto;border-radius:0;background:none;margin:0;touch-action:none}
button.on{background:var(--ac);color:#fff}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Creador de video publicitario</h1>
<div class="card">
<canvas id="cv"></canvas>
<button id="play" class="sec">▶ Vista previa</button>
<button id="rec">⏺ Grabar video</button>
<div id="msg"></div>
<div id="adjbar" hidden>
<label>Tamaño de la foto</label>
<input type="range" id="adjs" min="0.3" max="4" step="0.01" value="1" style="width:100%">
<div class="row"><div><button type="button" id="adjr" class="sec">Restablecer</button></div><div><button type="button" id="adjok">Listo</button></div></div>
</div>
</div>
<div class="card" id="res" hidden>
<video id="vid" controls playsinline></video>
<button id="share">Compartir / guardar</button>
</div>
<div class="card">
<button type="button" id="psave" style="margin-top:0">💾 Guardar proyecto (para seguir editando)</button>
<label>Abrir un proyecto guardado</label>
<input type="file" id="pload">
<div id="pmsg" style="font-size:13px;color:var(--mut);margin-top:6px"></div>
</div>
<form class="card" id="f" onsubmit="return false">
<label>Nombre del negocio o producto</label>
<input type="text" id="name" value="Tu Negocio">
<label>Eslogan</label>
<input type="text" id="slogan" value="Calidad que se nota">
<label>Frases (una por línea, máximo 4)</label>
<textarea id="lines">Los mejores precios
Atención rápida y de confianza
Pregunta por nuestras promociones</textarea>
<label>Oferta o precio (opcional)</label>
<input type="text" id="offer" value="2x1 esta semana">
<label>Contacto (WhatsApp, dirección…)</label>
<input type="text" id="contact" value="WhatsApp 55 0000 0000">
<div class="row">
<div><label>Color 1</label><input type="color" id="c1" value="#e8590c"></div>
<div><label>Color 2</label><input type="color" id="c2" value="#7a1d6b"></div>
</div>
<label>Colores del texto</label>
<div class="row">
<div><label>Título</label><input type="color" id="ct" value="#ffffff"></div>
<div><label>Eslogan</label><input type="color" id="cf" value="#ffffff"></div>
<div><label>Oferta</label><input type="color" id="co" value="#ffe066"></div>
<div><label>Contacto</label><input type="color" id="cc" value="#ffffff"></div>
</div>
<label>Color de cada frase</label>
<div class="row">
<div><label>Frase 1</label><input type="color" id="cl1" value="#ffffff"></div>
<div><label>Frase 2</label><input type="color" id="cl2" value="#ffffff"></div>
<div><label>Frase 3</label><input type="color" id="cl3" value="#ffffff"></div>
<div><label>Frase 4</label><input type="color" id="cl4" value="#ffffff"></div>
</div>
<label>Letra del título y la oferta</label>
<select id="f1"></select>
<label>Letra de las frases y el contacto</label>
<select id="f2"></select>
<label>Posición de las fotos</label>
<select id="pos"><option value="fondo">Al fondo (el texto va encima)</option><option value="frente">Al frente (la foto va encima del texto)</option><option value="recorte">Recorte (el texto queda detrás de la persona u objeto)</option></select>
<label>Cuánto tapa la foto al texto (solo al frente)</label>
<input type="range" id="ov" min="0" max="1" step="0.05" value="0.35" style="width:100%">
<label>Fotos (opcional, hasta 12)</label>
<input type="file" id="fotos" accept="image/*" multiple>
<div id="nf" style="font-size:13px;color:var(--mut);margin-top:4px"></div>
<label>Quitar el fondo de una foto (para que el texto quede detrás)</label>
<div class="row"><div style="flex:2"><select id="fsel"></select></div><div><button type="button" id="fcut" class="sec" style="margin-top:0">✂ Quitar fondo</button></div></div>
<button type="button" id="fadj" class="sec">✋ Mover y agrandar la foto elegida</button>
<label>¿Ya tienes la foto sin fondo (PNG)? Súbela para la foto elegida</label>
<input type="file" id="pngcut" accept="image/png">
<label>Voz (opcional)</label>
<button type="button" id="mic" class="sec">🎙 Grabar mi voz</button>
<label>o sube un audio de voz</label>
<input type="file" id="vozf">
<div id="nv" style="font-size:13px;color:var(--mut);margin-top:4px"></div>
<label>Efecto de voz</label>
<select id="efecto"><option value="normal">Normal</option><option value="ardilla">Ardilla (aguda)</option><option value="gigante">Gigante (grave)</option><option value="robot">Robot</option><option value="eco">Eco de cueva</option><option value="telefono">Teléfono viejo</option></select>
<button type="button" id="probar" class="sec">🔊 Probar efecto</button>
<label>Música o audio (opcional, desde Archivos)</label>
<input type="file" id="musica">
<div id="nm" style="font-size:13px;color:var(--mut);margin-top:4px"></div>
<div id="recm" hidden>
<label>Elige el tramo de la canción (la parte naranja es la que se usa)</label>
<canvas id="wf" width="600" height="90" style="max-width:100%;width:100%;height:70px;aspect-ratio:auto;margin:0;border-radius:8px;background:var(--bg);border:1px solid var(--bd)"></canvas>
<label>Inicio: <b id="tiv">0:00</b></label>
<input type="range" id="ti" min="0" max="100" step="0.1" value="0" style="width:100%">
<label>Fin: <b id="tfv">0:00</b></label>
<input type="range" id="tf" min="0" max="100" step="0.1" value="100" style="width:100%">
<div id="tdur" style="font-size:13px;color:var(--mut)"></div>
<button type="button" id="tpl" class="sec">▶ Escuchar tramo</button>
</div>
</form>
</main>
<div id="ed" hidden>
<div class="edbar">
<button type="button" data-m="varita" class="sec on">Varita</button>
<button type="button" data-m="borrar" class="sec">Borrar</button>
<button type="button" data-m="restaurar" class="sec">Restaurar</button>
<button type="button" id="undo" class="sec">Deshacer</button>
</div>
<div class="edbar"><span>Tolerancia</span><input type="range" id="tol" min="5" max="120" value="40"><span>Pincel</span><input type="range" id="brush" min="8" max="120" value="40"></div>
<div class="edbar" style="justify-content:center">Varita: toca el fondo. Borrar y Restaurar: pasa el dedo.</div>
<div class="edbar"><button type="button" id="auto">✨ Recorte automático</button></div>
<div class="edwrap"><canvas id="ec"></canvas></div>
<div class="edbar">
<button type="button" id="edok">Listo</button>
<button type="button" id="edno" class="sec">Cancelar</button>
<button type="button" id="edclr" class="sec">Quitar recorte</button>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),W=720,H=1280;
cv.width=W;cv.height=H;
let imgs=[],raf=null,blob=null,musica=null,voz=null,mrec=null,voiceSrc=null,front=false,curK='',recorte=false,cuts=[],audioFalla=false,tr=[],adj=null,tAdj=0;
const ease=x=>1-Math.pow(1-x,3);
const clamp=x=>Math.max(0,Math.min(1,x));
function data(){
  return{name:$('name').value.trim(),slogan:$('slogan').value.trim(),
    lines:$('lines').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,4),
    offer:$('offer').value.trim(),contact:$('contact').value.trim(),c1:$('c1').value,c2:$('c2').value,
    ct:$('ct').value,cf:$('cf').value,co:$('co').value,cc:$('cc').value,f1:$('f1').value,f2:$('f2').value,
    cl:[1,2,3,4].map(n=>$('cl'+n).value)};
}
function scenes(){
  const d=data(),s=[{k:'intro',t:2.6}];
  d.lines.forEach((l,i)=>s.push({k:'line',t:2.6,text:l,i}));
  if(d.offer)s.push({k:'offer',t:2.8});
  const extra=Math.max(0,imgs.length-(s.length+1));
  for(let k=0;k<extra;k++)s.push({k:'foto',t:2.2});
  s.push({k:'cta',t:3.2});
  s.forEach((x,n)=>{x.im=n});
  return s;
}
const total=()=>scenes().reduce((a,s)=>a+s.t,0);
function wrap(s,mw){
  const out=[];let c='';
  for(const w of s.split(' ')){
    const t=c?c+' '+w:w;
    if(ctx.measureText(t).width>mw&&c){out.push(c);c=w}else c=t;
  }
  if(c)out.push(c);return out;
}
function txt(str,y,size,color,a,weight,fam){
  ctx.save();
  ctx.globalAlpha=clamp(a);ctx.fillStyle=color;
  ctx.font=(weight||'800')+' '+size+'px '+(fam&&fam!=='system-ui'?'"'+fam+'", ':'')+'system-ui,-apple-system,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  const ls=wrap(str,W-120),lh=size*1.2,y0=y-(ls.length-1)*lh/2;
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=12;
  ls.forEach((l,k)=>ctx.fillText(l,W/2,y0+k*lh+(1-clamp(a))*40-(front&&curK!=='offer'?H*.15:0)));
  ctx.restore();
}
function bg(i,p,d,noImg){
  const im=!noImg&&!front&&imgs.length?imgs[i%imgs.length]:null;
  if(im){
    const T=tr[i%imgs.length]||{x:0,y:0,s:1};
    if(T.s<1||T.x||T.y){const g0=ctx.createLinearGradient(0,0,W,H);g0.addColorStop(0,d.c1);g0.addColorStop(1,d.c2);ctx.fillStyle=g0;ctx.fillRect(0,0,W,H)}
    const r=Math.max(W/im.width,H/im.height)*(1+.1*p)*T.s,w=im.width*r,h=im.height*r;
    ctx.drawImage(im,(W-w)/2+T.x,(H-h)/2+T.y,w,h);
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'rgba(0,0,0,.35)');g.addColorStop(1,'rgba(0,0,0,.75)');
    if(curK!=='foto'){ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  }else{
    const g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,d.c1);g.addColorStop(1,d.c2);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.1)';
    for(let k=0;k<3;k++){
      ctx.beginPath();
      ctx.arc(W*(.2+.3*k)+Math.sin(p*3+k)*40,H*(.25+.25*k)+p*60,140+k*40,0,7);
      ctx.fill();
    }
  }
}
function drawAt(t){if(adj!==null)t=tAdj;front=$('pos').value==='frente'&&imgs.length>0;recorte=$('pos').value==='recorte'&&imgs.length>0;drawCore(t)}
function drawCore(t){
  const d=data(),sc=scenes();
  let acc=0,s=sc[sc.length-1],lt=s.t;
  for(const x of sc){if(t<acc+x.t){s=x;lt=t-acc;break}acc+=x.t}
  curK=s.k;const p=clamp(lt/s.t),a=ease(clamp(lt/.6))*clamp((s.t-lt)/.4+ (s.k==='cta'?1:0));
  const full=()=>{const sv=front;front=false;bg(s.im,p,d);front=sv};
  if(s.k==='intro'){
    bg(s.im,p,d);
    txt(d.name||' ',H*.42,96,d.ct,a,'800',d.f1);
    txt(d.slogan,H*.58,44,d.cf,ease(clamp((lt-.5)/.6))*clamp((s.t-lt)/.4),'600',d.f2);card(s.im,p,lt);recorteTop(s.im,p);
  }else if(s.k==='line'){
    bg(s.im,p,d);
    ctx.fillStyle=d.co;ctx.fillRect(W/2-60,H*.5-190,120,8);
    txt(s.text,H*.5,64,d.cl[s.i],a,'800',d.f2);card(s.im,p,lt);recorteTop(s.im,p);
  }else if(s.k==='offer'){
    full();
    txt('¡OFERTA!',H*.34,60,d.co,a,'700',d.f1);
    txt(d.offer,H*.5,110,d.co,a,'800',d.f1);
    recorteTop(s.im,p);
  }else if(s.k==='foto'){
    full();recorteTop(s.im,p);
  }else{
    bg(s.im,p,d);
    txt(d.name||' ',H*.4,84,d.ct,a,'800',d.f1);
    txt(d.contact,H*.56,50,d.cc,ease(clamp((lt-.4)/.6)),'600',d.f2);card(s.im,p,lt);recorteTop(s.im,p);
  }
}
function foto(im,p,k){
  const T=tr[k]||{x:0,y:0,s:1};
  const r=Math.max(W/im.width,H/im.height)*(1+.1*p)*T.s,w=im.width*r,h=im.height*r;
  ctx.drawImage(im,(W-w)/2+T.x,(H-h)/2+T.y,w,h);
}
function recorteTop(i,p){
  if(!recorte||!imgs.length)return;
  const c=cuts[i%imgs.length];
  if(c)foto(c,p,i%imgs.length);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath()}
function card(i,p,lt){
  if(!front||!imgs.length)return;
  const im=imgs[i%imgs.length],ov=+$('ov').value;
  const top=H*(.46-ov*.12),w=W*.8,h=H*.93-top;
  const dy=(1-ease(clamp(lt/.8)))*H*.35;
  ctx.save();
  ctx.translate(W/2,top+h/2+dy);ctx.rotate(-.03);
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=30;
  ctx.fillStyle='#fff';rr(-w/2-8,-h/2-8,w+16,h+16,26);ctx.fill();
  ctx.shadowBlur=0;
  rr(-w/2,-h/2,w,h,20);ctx.clip();
  const T=tr[i%imgs.length]||{x:0,y:0,s:1};
  const r=Math.max(w/im.width,h/im.height)*(1+.08*p)*T.s;
  ctx.drawImage(im,-im.width*r/2+T.x*.6,-im.height*r/2+T.y*.6,im.width*r,im.height*r);
  ctx.restore();
}
function armaVoz(ac,buf,dest,ef){
  const s=ac.createBufferSource();s.buffer=buf;
  const g=ac.createGain();g.gain.value=1.4;
  let n=s;
  if(ef==='ardilla')s.playbackRate.value=1.6;
  else if(ef==='gigante')s.playbackRate.value=.72;
  else if(ef==='robot'){
    const m=ac.createGain();m.gain.value=0;
    const o=ac.createOscillator();o.type='square';o.frequency.value=55;
    o.connect(m.gain);o.start();
    s.connect(m);n=m;
  }else if(ef==='eco'){
    const d=ac.createDelay(1);d.delayTime.value=.28;
    const fb=ac.createGain();fb.gain.value=.45;
    d.connect(fb);fb.connect(d);
    const mix=ac.createGain();
    s.connect(mix);s.connect(d);d.connect(mix);n=mix;
  }else if(ef==='telefono'){
    const b=ac.createBiquadFilter();b.type='bandpass';b.frequency.value=1500;b.Q.value=.8;
    s.connect(b);n=b;
  }
  n.connect(g);
  g.connect(dest);
  return s;
}
function run(r,fin){
  if(adj!==null)salirAdj();
  cancelAnimationFrame(raf);
  const T=total(),t0=performance.now();
  const f=now=>{
    const t=(now-t0)/1000;
    drawAt(Math.min(t,T-.001));
    if(t<T)raf=requestAnimationFrame(f);
    else{if(r&&r.state!=='inactive')r.stop();if(fin)fin();busy(false)}
  };
  raf=requestAnimationFrame(f);
}
function busy(b){$('play').disabled=b;$('rec').disabled=b}
function msg(s){$('msg').textContent=s}
async function montaAudio(ac,dest){
  const T=total(),gain=ac.createGain(),nivel=voz?.35:.8;
  let src=null,vs=null;
  gain.gain.value=nivel;
  gain.connect(dest);
  if(dest!==ac.destination){
    const z=ac.createGain();z.gain.value=0;
    gain.connect(z);z.connect(ac.destination);
  }
  if(musica){
    const buf=await ac.decodeAudioData(await musica.arrayBuffer());
    src=ac.createBufferSource();src.buffer=buf;src.loop=true;if(musBuf){src.loopStart=tIni;src.loopEnd=Math.max(tFin,tIni+.5)}src.connect(gain);
  }
  if(voz){
    const vb=await ac.decodeAudioData(await voz.arrayBuffer());
    vs=armaVoz(ac,vb,dest,$('efecto').value);
  }
  return{
    start(){
      const t=ac.currentTime;
      gain.gain.setValueAtTime(nivel,t+Math.max(0,T-1.2));
      gain.gain.linearRampToValueAtTime(0,t+T);
      if(src)src.start(t,musBuf?tIni:0);
      if(vs)vs.start(t);
    },
    stop(){[src,vs].forEach(s=>{if(s){try{s.stop()}catch(_){}}})}
  };
}
$('play').onclick=async()=>{
  busy(true);msg('');
  const AC=window.AudioContext||window.webkitAudioContext;
  let au=null,ac=null;
  if((musica||voz)&&AC){
    ac=new AC();ac.resume();
    try{au=await montaAudio(ac,ac.destination)}
    catch(e){msg('No pude leer el audio: '+(e&&e.message?e.message:'formato no compatible'))}
  }
  if(au)au.start();
  run(null,()=>{if(au)au.stop();if(ac)ac.close()});
};
$('rec').onclick=async()=>{
  const AC=window.AudioContext||window.webkitAudioContext;
  audioFalla='';
  const ac=(musica||voz)&&AC?new AC():null;
  if(ac)ac.resume();
  await fuentesCargadas();
  const types=['video/mp4','video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'];
  const mt=window.MediaRecorder&&types.find(m=>MediaRecorder.isTypeSupported(m));
  if(!mt||!cv.captureStream){msg('Este navegador no puede grabar video.');return}
  let tracks=[...cv.captureStream(30).getVideoTracks()],au=null;
  if(ac){
    try{
      await ac.resume();
      const dest=ac.createMediaStreamDestination();
      au=await montaAudio(ac,dest);
      tracks=tracks.concat(dest.stream.getAudioTracks());
    }catch(e){audioFalla=e&&e.message?e.message:'formato no compatible';au=null}
  }
  const st=new MediaStream(tracks);
  const chunks=[],r=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:4e6,audioBitsPerSecond:128000});
  r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  r.onstop=()=>{
    if(au)au.stop();
    if(ac)ac.close();
    blob=new Blob(chunks,{type:mt.split(';')[0]});
    $('vid').src=URL.createObjectURL(blob);
    $('res').hidden=false;
    $('res').scrollIntoView({behavior:'smooth'});
    const nA=st.getAudioTracks().length;

function modelo(px,lab,val,N){
  const idx=[];
  for(let i=0;i<N;i++)if(lab[i]===val)idx.push(i);
  const base=[{m:[128,128,128],v:[4000,4000,4000],w:1}];
  if(idx.length<10)return base;
  const K=4,step=Math.max(1,(idx.length/2000)|0),S=[];
  for(let j=0;j<idx.length;j+=step){const i=idx[j];S.push([px[i*4],px[i*4+1],px[i*4+2]])}
  S.sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2]));
  let C=[];
  for(let k=0;k<K;k++)C.push(S[Math.floor((k+.5)*S.length/K)].slice());
  const as=new Array(S.length).fill(0);
  for(let t=0;t<6;t++){
    for(let j=0;j<S.length;j++){
      let bd=1e9,bk=0;
      for(let k=0;k<K;k++){
        const d=(S[j][0]-C[k][0])**2+(S[j][1]-C[k][1])**2+(S[j][2]-C[k][2])**2;
        if(d<bd){bd=d;bk=k}
      }
      as[j]=bk;
    }
    const sum=C.map(()=>[0,0,0,0]);
    for(let j=0;j<S.length;j++){const s=sum[as[j]];s[0]+=S[j][0];s[1]+=S[j][1];s[2]+=S[j][2];s[3]++}
    C=C.map((c,k)=>sum[k][3]?[sum[k][0]/sum[k][3],sum[k][1]/sum[k][3],sum[k][2]/sum[k][3]]:c);
  }
  const out=[];
  for(let k=0;k<K;k++){
    const mem=S.filter((_,j)=>as[j]===k);
    if(mem.length<3)continue;
    const v=[0,0,0];
    mem.forEach(p=>{for(let c=0;c<3;c++)v[c]+=(p[c]-C[k][c])**2});
    out.push({m:C[k],v:v.map(x=>Math.max(150,x/mem.length)),w:mem.length/S.length});
  }
  return out.length?out:base;
}
function costo(M,r,g,b){
  let p=0;
  for(const c of M){
    const d=(r-c.m[0])**2/c.v[0]+(g-c.m[1])**2/c.v[1]+(b-c.m[2])**2/c.v[2];
    p+=c.w*Math.exp(-.5*d)/Math.sqrt(c.v[0]*c.v[1]*c.v[2]);
  }
  return -Math.log(p+1e-12);
}
function suaviza(lab,fix,w,h,n){
  for(let t=0;t<n;t++){
    const cp=lab.slice();
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
      const i=y*w+x;
      if(fix[i])continue;
      let s=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)s+=cp[i+dy*w+dx];
      lab[i]=s>=5?1:0;
    }
  }
}
function vecinos(p,w,h){
  const x=p%w,y=(p/w)|0,o=[];
  if(x>0)o.push(p-1);

  if(y<h-1)o.push(p+w);

}
function limpia(lab,w,h){
  const N=w*h,comp=new Int32Array(N);
  let best=0,bestN=0,id=0;
  for(let s=0;s<N;s++){
    if(!lab[s]||comp[s])continue;
    id++;
    const st=[s];comp[s]=id;
    let n=0;
    while(st.length){
      const p=st.pop();n++;
      for(const q of vecinos(p,w,h))if(lab[q]&&!comp[q]){comp[q]=id;st.push(q)}
    }
    if(n>bestN){bestN=n;best=id}
  }
  for(let i=0;i<N;i++)lab[i]=comp[i]===best?1:0;
  const fuera=new Uint8Array(N),st=[];
  for(let i=0;i<N;i++){

    const p=st.pop();
    for(const q of vecinos(p,w,h))if(!lab[q]&&!fuera[q]){fuera[q]=1;st.push(q)}

function autoRecorte(){

  const w=Math.max(8,Math.round(o.width*sc)),h=Math.max(8,Math.round(o.height*sc));
  const sm=document.createElement('canvas');sm.width=w;sm.height=h;
  const sx=sm.getContext('2d');sx.drawImage(o,0,0,w,h);
  const px=sx.getImageData(0,0,w,h).data,N=w*h;
  const lab=new Uint8Array(N),fix=new Uint8Array(N);
  const mx=Math.round(w*.08),my=Math.round(h*.08);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x,nx=(x/w-.5)/.5,ny=(y/h-.5)/.5,q=nx*nx+ny*ny;
    if(x<mx||y<my||x>=w-mx||y>=h-my){fix[i]=1;lab[i]=0}
    else if(q<.18){fix[i]=1;lab[i]=1}
    else lab[i]=q<.7?1:0;
  }
  for(let it=0;it<5;it++){
    const fg=modelo(px,lab,1,N),bg=modelo(px,lab,0,N);
    for(let i=0;i<N;i++){
      if(fix[i])continue;
      const r=px[i*4],g=px[i*4+1],b=px[i*4+2];
      const x=(i%w)/w-.5,y=((i/w)|0)/h-.5,d=(x*x+y*y)*4;
      lab[i]=(costo(fg,r,g,b)+d*2.5<costo(bg,r,g,b))?1:0;
    }
    suaviza(lab,fix,w,h,2);
  }
  limpia(lab,w,h);
  const mk=document.createElement('canvas');mk.width=w;mk.height=h;
  const mc=mk.getContext('2d'),mi=mc.createImageData(w,h);
  for(let i=0;i<N;i++){const v=lab[i]?255:0;mi.data[i*4]=v;mi.data[i*4+1]=v;mi.data[i*4+2]=v;mi.data[i*4+3]=255}
  mc.putImageData(mi,0,0);

  const bc=big.getContext('2d');
  bc.imageSmoothingEnabled=true;bc.imageSmoothingQuality='high';
  bc.drawImage(mk,0,0,o.width,o.height);
  const bd=bc.getImageData(0,0,o.width,o.height).data;
  const wc=E.work.getContext('2d');
  wc.clearRect(0,0,o.width,o.height);wc.drawImage(o,0,0);
  const wi=wc.getImageData(0,0,o.width,o.height),d=wi.data;
  for(let i=0;i<o.width*o.height;i++)d[i*4+3]=Math.max(0,Math.min(255,(bd[i*4]-110)*3.2));
  wc.putImageData(wi,0,0);
  pintaEd();
}

$('adjr').onclick=()=>{if(adj===null)return;tr[adj]={x:0,y:0,s:1};actualizaAdj()};
$('adjok').onclick=salirAdj;

const IDS=['name','slogan','lines','offer','contact','c1','c2','ct','cf','co','cc','cl1','cl2','cl3','cl4','f1','f2','pos','ov','efecto'];
function aURL(src,tipo,max){
  const s=Math.min(1,max/Math.max(src.width,src.height)),c=document.createElement('canvas');
  c.width=Math.round(src.width*s);c.height=Math.round(src.height*s);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL(tipo,.88);
}
const leeURL=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)});
function deURL(u,nombre){
  const i=u.indexOf(','),h=u.slice(0,i),m=(h.match(/:(.*?);/)||[])[1]||'application/octet-stream';
  const bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);
  for(let j=0;j<bin.length;j++)a[j]=bin.charCodeAt(j);
  return new File([a],nombre||'audio',{type:m});
}
$('psave').onclick=async()=>{
  const o={v:1,campos:{},fotos:imgs.map(im=>aURL(im,'image/jpeg',1080)),
    cuts:imgs.map((_,k)=>cuts[k]?aURL(cuts[k],'image/png',1080):null),
    tr:imgs.map((_,k)=>tr[k]||null),ti:tIni,tf:tFin};
  IDS.forEach(id=>{o.campos[id]=$(id).value});
  let nota='';
  try{
    if(musica&&musica.size<9e6)o.musica={n:musica.name,d:await leeURL(musica)};
    else if(musica)nota=' La música no se incluyó porque pesa mucho.';
    if(voz&&voz.size<9e6)o.voz={n:voz.name||'voz',d:await leeURL(voz)};
  }catch(e){}
  const datos=JSON.stringify(o);
  try{
    const dl=window.claude&&claude.use?await claude.use('downloads'):null;
    if(dl)await dl.save({filename:'proyecto-video.json',data:datos});
    else{
      const f=new File([datos],'proyecto-video.json',{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});
      else throw 0;
    }
    $('pmsg').textContent='Proyecto guardado.'+nota;
  }catch(e){
    $('pmsg').textContent=(e&&e.code==='declined')?'Guardado cancelado.':'No pude guardar el proyecto en este navegador.';
  }
};
$('pload').addEventListener('change',async e=>{
  const f=e.target.files[0];
  if(!f)return;
  try{
    const o=JSON.parse(await f.text());
    IDS.forEach(id=>{if(o.campos&&o.campos[id]!=null)$(id).value=o.campos[id]});
    imgs=[];cuts=[];tr=[];
    const fotos=o.fotos||[];
    for(let k=0;k<fotos.length;k++){
      const im=new Image();im.src=fotos[k];await im.decode();imgs.push(im);
      if(o.cuts&&o.cuts[k]){
        const c=new Image();c.src=o.cuts[k];await c.decode();
        const cc=document.createElement('canvas');cc.width=c.width;cc.height=c.height;
        cc.getContext('2d').drawImage(c,0,0);cuts[k]=cc;
      }
      tr[k]=(o.tr&&o.tr[k])||null;
    }
    musica=o.musica?deURL(o.musica.d,o.musica.n):null;
    voz=o.voz?deURL(o.voz.d,o.voz.n):null;
    $('nm').textContent=musica?musica.name:'';
    $('nv').textContent=voz?voz.name:'';
    await cargaTramo();
    if(musBuf&&o.ti!=null){$('ti').value=o.ti;$('tf').value=o.tf;ajusta('ti')}
    $('nf').textContent=imgs.length+' foto(s) cargada(s)';
    actualizaSel();
    drawAt(1.6);
    fuentesCargadas().then(()=>drawAt(1.6));
    $('pmsg').textContent='Proyecto abierto.';
  }catch(err){$('pmsg').textContent='No pude abrir ese archivo de proyecto.'}
});
$('undo').onclick=()=>{
  const h=E.hist.pop();
  if(h){E.work.getContext('2d').putImageData(h,0,0);pintaEd()}
};
$('edok').onclick=()=>{
  cuts[E.i]=E.work;$('ed').hidden=true;actualizaSel();$('fsel').value=E.i;
  if($('pos').value!=='recorte')$('pos').value='recorte';
  drawAt(1.6);msg('Recorte guardado. El texto ahora va detrás de la foto.');
};
$('edno').onclick=()=>{$('ed').hidden=true};
$('edclr').onclick=()=>{cuts[E.i]=null;$('ed').hidden=true;actualizaSel();drawAt(1.6)};
$('vozf').addEventListener('change',e=>{
  voz=e.target.files[0]||null;
  $('nv').textContent=voz?voz.name:'';
});
$('probar').onclick=async()=>{
  if(!voz){msg('Primero graba o sube una voz.');return}
  const AC2=window.AudioContext||window.webkitAudioContext,ac2=new AC2();
  ac2.resume();
  try{
    const b=await ac2.decodeAudioData(await voz.arrayBuffer());
    armaVoz(ac2,b,ac2.destination,$('efecto').value).start();
  }catch(e){msg('No pude reproducir esa voz.')}
};
fuentesCargadas().then(()=>drawAt(1.6));
drawAt(1.6);
</script>
